
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minggu 06 - Bubble Sort</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
 margin:0;padding:20px;min-height:100vh;color:#333;
 background:linear-gradient(135deg,#ffb6d9,#c3b5ff,#a8e6ff)
}
.box{
 max-width:700px;margin:20px auto;background:white;padding:25px;
 border-radius:22px;box-shadow:0 10px 30px #7863a855
}
h2,.heading{text-align:center;color:#7545b8}
.sub{text-align:center;color:#777;margin-bottom:25px}
.count{
 background:linear-gradient(135deg,#ff70a6,#a477ff);
 color:white;padding:18px;border-radius:15px;text-align:center;margin:20px 0
}
.count p{margin:0 0 8px}
.count strong{font-size:32px}
.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
button{
 border:0;padding:12px 18px;border-radius:12px;
 color:white;font-weight:bold;cursor:pointer
}
button:hover{opacity:.8}
.pink{background:#ff70a6}
.purple{background:#805ad5}
.teal{background:#00a6a6}
.table-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th{background:linear-gradient(135deg,#805ad5,#ec72b5);color:white}
th,td{padding:12px 8px;text-align:center}
td{border-bottom:1px solid #eee}
tbody tr:nth-child(odd){background:#f5efff}
tbody tr:nth-child(even){background:#fff0f7}
tbody tr:hover{background:#dff8ff}
.footer{
 margin-top:22px;padding:15px;border-radius:12px;
 background:#f0eaff;color:#7545b8;font-size:13px
}
@media(max-width:600px){body{padding:10px}.box{padding:18px}}
</style>
</head>

<body>
<div class="box">
<h2>🌸 Nilai Mahasiswa 🌸</h2>
<p class="sub">Program Pengurutan Nilai Menggunakan Bubble Sort</p>

<div class="count">
<p>👩‍🎓 Jumlah Mahasiswa</p>
<strong>12 Mahasiswa</strong>
</div>

<div class="buttons">
<button class="pink" onclick="tampil(nilai,'📋 Data Awal Mahasiswa')">📋 Data Awal</button>
<button class="purple" onclick="urut(true)">⬆ Ascending</button>
<button class="teal" onclick="urut(false)">⬇ Descending</button>
</div>

<h3 class="heading" id="judul">📊 Data Awal Mahasiswa</h3>

<div class="table-wrap">
<table>
<thead>
<tr><th>No.</th><th>Nama Mahasiswa</th><th>Nilai UAS</th></tr>
</thead>
<tbody id="hasil"></tbody>
</table>
</div>

<div class="footer">
✨ Ascending: nilai terkecil ke terbesar
<br><br>
💜 Descending: nilai terbesar ke terkecil
<br><br>
📌 Pengurutan menggunakan algoritma Bubble Sort.
</div>
</div>

<script>
const nilai=[
{nama:"Dini",nilai:99.7},
{nama:"Mario",nilai:87.1},
{nama:"Yane",nilai:90.5},
{nama:"Maria",nilai:85.0},
{nama:"Andi",nilai:78.5},
{nama:"Budi",nilai:92.0},
{nama:"Sinta",nilai:88.5},
{nama:"Rina",nilai:75.0},
{nama:"Doni",nilai:80.0},
{nama:"Putri",nilai:95.5},
{nama:"Roni",nilai:82.0},
{nama:"Lala",nilai:89.0}
];

function tampil(data,judul){
 document.getElementById("judul").textContent=judul;
 document.getElementById("hasil").innerHTML=data.map((m,i)=>`
 <tr><td>${i+1}</td><td>${m.nama}</td><td>${m.nilai.toFixed(1)}</td></tr>
 `).join("");
}

function urut(naik){
 let data=[...nilai];

 for(let i=0;i<data.length-1;i++){
  for(let j=0;j<data.length-1-i;j++){
   if(naik ? data[j].nilai>data[j+1].nilai
           : data[j].nilai<data[j+1].nilai){
    let sementara=data[j];
    data[j]=data[j+1];
    data[j+1]=sementara;
   }
  }
 }

 tampil(data,naik
 ? "⬆ Ascending (Kecil ke Besar)"
 : "⬇ Descending (Besar ke Kecil)");
}

tampil(nilai,"📊 Data Awal Mahasiswa");
</script>
</body>
</html>
